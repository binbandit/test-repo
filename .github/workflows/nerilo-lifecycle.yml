name: Nerilo lifecycle
on:
  pull_request:
    branches: [nerilo/lifecycle-base-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test the demo feature
        run: node --test nerilo-demo/*.test.cjs
